{% extends 'basic.html' %}
{% load i18n %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg rounded-3">
                <div class="card-header bg-warning bg-gradient text-dark py-3 rounded-top-3 border-bottom-0">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-edit me-2 fa-lg"></i>
                        <h4 class="mb-0 fw-bold">{% trans 'Edit Tower' %} </h4>
                    </div>
                </div>
                <div class="card-body p-4 bg-white">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="towerName" class="form-label fw-bold text-secondary small text-uppercase">{% trans 'Tower Name' %} </label>
                            {{form.name_tower}}
                        </div>
                        <div class="mb-3">
                            <label for="location" class="form-label fw-bold text-secondary small text-uppercase">{% trans 'Location' %} </label>
                            {{form.location}}
                        </div>
                        <div class="mb-4">
                            <label for="height" class="form-label fw-bold text-secondary small text-uppercase">{% trans 'Height' %} </label>
                            <div class="input-group">
                                {{form.height}}
                                <span class="input-group-text bg-light text-muted">{% trans 'meters' %} </span>
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center pt-2">
                            <a href="{% url 'view_towers' %}" class="btn btn-outline-secondary px-4">{% trans 'Cancel' %} </a>
                            <button type="submit" value="Edit Tower" class="btn btn-warning px-4 fw-bold shadow-sm">
                                <i class="fas fa-save me-1"></i>{% trans 'Save Changes' %}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
