{% extends 'basic.html' %}
{% load i18n %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg rounded-3">
                <div class="card-header bg-success text-white py-3 rounded-top-3">
                    <h4 class="mb-0"><i class="fas fa-plus-circle me-2"></i>{% trans 'New Tower Registration' %}</h4>
                </div>
                <div class="card-body p-4 bg-light">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label for="name_tower" class="form-label fw-bold text-dark">{% trans 'Tower Name' %}</label>
                            {{ form.name_tower }}
                            <div class="form-text">{% trans 'Give the tower a unique identifier.' %}</div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" value="Add Tower" class="btn btn-success py-2 fw-bold shadow-sm">
                                {% trans 'Create Tower' %}
                            </button>
                            <a href="{% url 'view_towers' %}" class="btn btn-link text-decoration-none text-muted text-center">{% trans 'Cancel' %}</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
