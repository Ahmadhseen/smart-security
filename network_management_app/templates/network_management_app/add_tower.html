{% extends 'basic.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg rounded-3">
                <div class="card-header bg-success text-white py-3 rounded-top-3">
                    <h4 class="mb-0"><i class="fas fa-plus-circle me-2"></i>New Tower Registration</h4>
                </div>
                <div class="card-body p-4 bg-light">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label for="name_tower" class="form-label fw-bold text-dark">Tower Name</label>
                            {{ form.name_tower }}
                            <div class="form-text">Give the tower a unique identifier.</div>
                        </div>
                        
                        <div class="row g-3 mb-4">
                            <div class="col-md-8">
                                <label for="location" class="form-label fw-bold text-dark">Location</label>
                                {{ form.location }}
                            </div>
                            <div class="col-md-4">
                                <label for="height" class="form-label fw-bold text-dark">Height (m)</label>
                                <div class="input-group">
                                    {{ form.height }}
                                    <span class="input-group-text">m</span>
                                </div>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" value="Add Tower" class="btn btn-success py-2 fw-bold shadow-sm">
                                Create Tower
                            </button>
                            <a href="{% url 'view_towers' %}" class="btn btn-link text-decoration-none text-muted text-center">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
