{% extends 'register.html' %}
{% load django_bootstrap5 %}



{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg rounded-3">
                <div class="card-header bg-primary text-white py-3 rounded-top-3">
                    <h4 class="mb-0"><i class="fas fa-plus-circle me-2"></i>Sign In</h4>
                </div>
                <div class="card-body p-4 bg-light">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="row g-3 mb-10">
                            <div class="col-md-6">
                            <label for="first_name" class="form-label fw-bold text-dark">First Name</label>
                            {{ form.first_name }}
                            </div>
                        
                            <div class="col-md-6">
                                <label for="last_name" class="form-label fw-bold text-dark">Last Name</label>
                                {{ form.last_name }}
                            </div> 
                        </div>       

                        <div class="row g-3 mb-10">
                            <div class="col-md-6">
                            <label for="username" class="form-label fw-bold text-dark">Username</label>
                            {{ form.username }}
                            </div>
                        

                            <div class="col-md-6">
                                <label for="password" class="form-label fw-bold text-dark">Password</label>
                                
                                    {{ form.password }}
                                    
                            </div>
                        </div>
                </div>

                        <div class="d-grid gap-2">
                            <button type="submit" value="sign_in" class="btn btn-primary py-2 fw-bold shadow-sm">
                                Sign In
                            </button>
                            <a href="{% url 'home' %}" class="btn btn-link text-decoration-none text-muted text-center">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock content %}
